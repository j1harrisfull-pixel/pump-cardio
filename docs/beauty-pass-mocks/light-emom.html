<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Beauty pass · Light EMOM</title>
<style>
  :root{
    --bg:#FFFFFF; --card:#F5F5F7; --text:#111111; --muted:#6B6B70;
    --line:#E8E8ED; --accent:#FF8A3D; --soft:rgba(255,138,61,.14);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:#D8D8DC; color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .phone{
    width:390px; min-height:844px; margin:0 auto;
    background:var(--bg); padding:52px 22px 28px;
    display:flex; flex-direction:column;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:28px;
  }
  .back{
    width:40px; height:40px; border-radius:12px; border:1px solid var(--line);
    background:#F5F5F7; color:var(--muted);
    display:grid; place-items:center; padding:0;
  }
  .back svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round}
  .label{text-align:center}
  .label .k{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); font-weight:700}
  .label .s{font-size:13px; color:var(--muted); margin-top:3px}
  .menu{
    width:40px; height:40px; border:0; background:transparent; color:var(--muted);
    display:grid; place-items:center;
  }
  .menu svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round}

  .minute{
    text-align:center; color:var(--muted); font-size:14px; font-weight:600;
    letter-spacing:.04em; margin-bottom:8px;
  }
  .minute b{color:var(--text); font-weight:700}

  .clock-wrap{display:flex; justify-content:center; margin:8px 0 28px}
  .clock{
    width:240px; height:240px; border-radius:50%;
    background:conic-gradient(var(--accent) 0 62%, var(--line) 0);
    display:grid; place-items:center;
    position:relative;
    box-shadow:0 12px 32px rgba(255,138,61,.18);
  }
  .clock::before{
    content:""; position:absolute; inset:10px; border-radius:50%; background:#FFFFFF;
  }
  .clock .inner{position:relative; z-index:1; text-align:center}
  .time{
    font-size:72px; font-weight:800; letter-spacing:-.04em;
    font-variant-numeric:tabular-nums; line-height:1; color:#111;
  }
  .phase{
    margin-top:8px; font-size:13px; color:var(--accent); font-weight:700;
    letter-spacing:.08em; text-transform:uppercase;
  }

  .now{
    background:var(--card); border-radius:20px; padding:22px 20px;
    margin-bottom:12px; border:1px solid var(--line);
  }
  .now .tag{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); font-weight:700; margin:0 0 10px;
  }
  .now h2{
    font-size:26px; font-weight:700; margin:0 0 10px; letter-spacing:-.02em; line-height:1.2;
  }
  .moves{list-style:none; padding:0; margin:0}
  .moves li{
    font-size:17px; font-weight:600; padding:6px 0;
    border-top:1px solid var(--line);
  }
  .moves li:first-child{border-top:0; padding-top:0}
  .moves span{color:var(--muted); font-weight:500; font-size:15px; margin-left:6px}

  .next{
    padding:14px 18px; border-radius:16px; border:1px solid var(--line);
    margin-bottom:18px; background:#FFFFFF;
  }
  .next .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 6px}
  .next p{margin:0; font-size:15px; color:var(--muted); line-height:1.4}
  .next strong{color:var(--text); font-weight:600}

  .hint{
    text-align:center; font-size:13px; color:var(--muted); margin:0 0 22px; line-height:1.45;
  }
  .hint b{color:var(--text); font-weight:600}

  .bar{margin-top:auto; display:flex; gap:10px}
  .bar button{
    flex:1; min-height:52px; border-radius:14px; border:1px solid var(--line);
    background:#F5F5F7; color:var(--text); font:700 15px inherit;
  }
  .bar .pause{
    background:var(--accent); border-color:var(--accent); color:#fff; flex:1.3;
    box-shadow:0 6px 16px rgba(255,138,61,.35);
  }
  .prog{
    height:3px; background:var(--line); border-radius:2px; margin:0 0 18px; overflow:hidden;
  }
  .prog i{display:block; height:100%; width:26.6%; background:var(--accent); border-radius:2px}
</style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <button class="back" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="label">
        <div class="k">Single-bell EMOM</div>
        <div class="s">16 kg · Saturday</div>
      </div>
      <button class="menu" aria-label="Stop">
        <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
      </button>
    </div>

    <div class="prog" aria-hidden="true"><i></i></div>

    <div class="minute">Minute <b>4</b> of 15</div>

    <div class="clock-wrap">
      <div class="clock">
        <div class="inner">
          <div class="time">0:37</div>
          <div class="phase">Work</div>
        </div>
      </div>
    </div>

    <div class="now">
      <div class="tag">This minute</div>
      <h2>Complex · right</h2>
      <ul class="moves">
        <li>Clean <span>×3</span></li>
        <li>Front-rack squat <span>×3</span></li>
        <li>Press <span>×3</span></li>
      </ul>
    </div>

    <div class="next">
      <div class="tag">Next minute</div>
      <p><strong>Swings ×15</strong> + goblet squat ×5</p>
    </div>

    <p class="hint">Rest is whatever is left of the minute.<br>Round <b>2</b> of 5 · side alternates each minute.</p>

    <div class="bar">
      <button>Back</button>
      <button class="pause">Pause</button>
      <button>Next</button>
    </div>
  </div>
</body>
</html>
