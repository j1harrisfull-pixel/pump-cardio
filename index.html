var BR="Breathe out on the effort – never hold your breath.";
var HT={
"db-bench":{q:"dumbbell bench press",s:["Sit on the bench with a dumbbell on each thigh, then lie back and bring them over your chest.","Plant feet flat, squeeze shoulder blades together and down.","Lower the dumbbells slowly to the sides of your chest, elbows about 45° from your body.","Press back up over your chest, breathing out as you press."],c:["Wrists stacked over elbows","Shoulder blades pinned to the bench","Control the lowering"],m:"Flaring elbows straight out to the sides, which strains the shoulders.",z:BR},
"cs-row":{q:"chest supported dumbbell row",s:["Set a bench to about 30–45° and lie face down, chest on the pad, chin just past the top.","Let the dumbbells hang straight down, palms facing in.","Pull elbows back towards your hips, squeezing shoulder blades together.","Pause, then lower slowly to a full arm stretch."],c:["Chest stays on the pad","Lead with the elbows","Neck long, look at the floor ahead"],m:"Shrugging up to the ears instead of pulling back.",z:BR},
"goblet-squat":{q:"kettlebell goblet squat",s:["Hold the kettlebell by the horns against your chest.","Stand feet shoulder-width, toes slightly out.","Sit down between your heels, keeping chest up and elbows inside knees.","Drive through the whole foot to stand, breathing out."],c:["Heels stay down","Knees track over toes","Tall chest"],m:"Letting the knees cave inwards.",z:BR},
"pullup-dip":{q:"assisted pull up feet on box",s:["Pull-up: grip the bar just wider than shoulders, one or both feet on the block for help.","Pull your chest towards the bar, elbows down to your sides.","Lower slowly to straight arms.","Dips: hands on the bars, feet on the block, lower until upper arms are about level, then press up."],c:["Use the legs only as much as needed","Shoulders down away from ears","Slow lowering"],m:"Jerking or kicking up and dropping fast.",z:BR+" Stop dips short of any shoulder pain."},
"db-shoulder-press":{q:"seated dumbbell shoulder press",s:["Sit on an upright bench, back supported, dumbbells at shoulder height.","Brace your stomach lightly, ribs down.","Press the dumbbells up until arms are straight, breathing out.","Lower slowly back to shoulder height."],c:["Ribs down, don't arch the back","Forearms vertical","Smooth, no bounce"],m:"Leaning back and arching the lower back to lift.",z:BR},
"farmers-carry":{q:"farmers carry",s:["Deadlift a dumbbell or kettlebell in each hand with a flat back.","Stand tall, shoulders down and back.","Walk with short, steady steps for the set distance or time.","Squat or hinge to set them down – don't drop them."],c:["Tall posture","Tight grip","Breathe normally"],m:"Leaning or letting the shoulders round forward.",z:"Breathe steadily the whole time."},
"incline-db-press":{q:"incline dumbbell press",s:["Set the bench to about 30°, sit back with dumbbells on your thighs.","Lie back and bring them over your upper chest.","Lower slowly to the sides of your upper chest.","Press up and slightly in, breathing out."],c:["Low incline, about 30°","Elbows about 45°","Follow the tempo"],m:"Setting the bench too steep, turning it into a shoulder press.",z:BR},
"hk-db-press":{q:"half kneeling single arm dumbbell press",s:["Kneel on one knee (a pad helps), front foot flat; hold one dumbbell at the shoulder on the kneeling-leg side.","Squeeze the glute of the down leg and keep ribs down.","Press the dumbbell straight up, breathing out.","Lower slowly to the shoulder; finish reps, then switch sides."],c:["Squeeze the back glute","Don't lean away","Bicep finishes by your ear"],m:"Arching the back or tilting the body to get it up.",z:BR},
"assisted-chinup":{q:"assisted chin up feet on box",s:["Grip the bar shoulder-width, palms facing you.","Put one or both feet on the block below for help.","Pull your chest up towards the bar, elbows down to your ribs.","Lower slowly (about 4 s) to straight arms."],c:["Use the feet just enough","Shoulders down first","Slow on the way down"],m:"Dropping quickly from the top.",z:BR},
"lateral-raise":{q:"dumbbell lateral raise",s:["Stand with light dumbbells at your sides, slight bend in the elbows.","Raise the arms out to the sides, leading with the elbows.","Stop at shoulder height.","Lower slowly."],c:["Light weight","Elbows lead","No shrugging"],m:"Swinging the body to throw the weights up.",z:BR},
"hammer-curl":{q:"dumbbell hammer curl",s:["Stand with dumbbells at your sides, palms facing in.","Keep elbows pinned to your sides.","Curl the weights up towards your shoulders.","Lower slowly to straight arms."],c:["Palms stay facing in","Elbows still","Slow lowering"],m:"Swinging the hips to lift.",z:BR},
"db-rdl":{q:"dumbbell romanian deadlift",s:["Stand holding dumbbells in front of your thighs, feet hip-width.","Soften the knees, then push your hips back, sliding the weights down your legs.","Go until you feel a hamstring stretch (about mid-shin), back flat.","Drive the hips forward to stand, breathing out."],c:["Hips back, not down","Weights close to the legs","Neck neutral – eyes a little ahead"],m:"Rounding the back or bending the knees into a squat.",z:BR+" Keep your head level with your spine – don't let it drop below the hips."},
"dead-bug":{q:"dead bug exercise",s:["Lie on your back, arms straight up, knees bent at 90° above hips.","Press your lower back gently into the floor.","Slowly reach one arm back and the opposite leg out, breathing out.","Return and switch sides."],c:["Low back stays down","Move slowly","Long exhale as you reach"],m:"Low back arching off the floor.",z:"Keep breathing – exhale as you reach."},
"reverse-lunge":{q:"dumbbell reverse lunge",s:["Stand tall holding dumbbells at your sides (or one, for offset).","Step one foot back and lower the back knee towards the floor.","Keep the front shin fairly upright and your chest tall.","Push through the front foot to step back up. Finish one side, then switch."],c:["Tall torso","Soft knee touch","Front heel down"],m:"Front knee caving inwards.",z:BR+" Hold the rack with one hand if balance is shaky."},
"side-plank":{q:"side plank",s:["Lie on your side, elbow under shoulder, legs stacked (or knees bent for the short-lever version).","Lift your hips so your body forms a straight line.","Hold, keeping hips high and breathing steadily.","Lower and switch sides."],c:["Elbow under shoulder","Hips forward and up","Breathe steadily"],m:"Hips sagging or rolling back.",z:"Keep breathing – no breath-holding."},
"calf-raise":{q:"single leg calf raise",s:["Stand on one foot on the edge of the block, heel hanging off; hold the rack.","Lower the heel slowly below the block.","Rise up onto the ball of the foot as high as you can.","Pause, lower slowly; finish reps, then switch."],c:["Full range","Pause at top and bottom","Light hand support"],m:"Bouncing quickly at the bottom.",z:BR},
"kb-swing":{q:"kettlebell swing",s:["Stand with the bell a foot in front, feet just wider than hips.","Hinge, grab the handle and hike it back between your legs.","Snap the hips forward to float the bell to chest height, arms relaxed.","Let it swing back, hinge again and repeat. Park it in front when done."],c:["Hinge, not squat","Power from the hips","Exhale sharply at the top"],m:"Lifting with the arms or squatting the swing.",z:"Breathe out at the top of every swing – no breath-holding."},
"incline-pushup":{q:"incline push up on bench",s:["Hands on the bench edge just wider than shoulders.","Walk feet back so your body is in a straight line.","Lower your chest towards the bench slowly.","Push away, breathing out."],c:["Body straight like a plank","Elbows about 45°","Chest to bench"],m:"Hips sagging.",z:BR},
"kb-sumo-dl":{q:"kettlebell sumo deadlift",s:["Stand with feet wide, toes out, bell between your feet.","Hinge and bend knees to grip the handle, back flat, chest proud.","Push the floor away to stand tall, breathing out.","Lower under control the same way."],c:["Wide stance","Knees push out","Flat back"],m:"Rounding the back to reach the bell.",z:BR},
"suitcase-carry":{q:"suitcase carry",s:["Pick up one weight at your side like a suitcase.","Stand tall with shoulders level.","Walk with steady steps, resisting leaning towards the weight.","Switch hands halfway."],c:["Shoulders level","Don't lean","Brace lightly"],m:"Leaning towards or away from the weight.",z:"Breathe normally the whole time."},
"prone-y-raise":{q:"incline prone y raise",s:["Lie face down on an incline bench with light dumbbells hanging down, thumbs up.","Set your shoulder blades back and down.","Raise the arms forward and out into a Y shape.","Lower slowly."],c:["Very light","Thumbs up","Squeeze shoulder blades"],m:"Shrugging and lifting with the neck.",z:BR},
"hip-9090":{q:"90 90 hip switch",s:["Sit with both knees bent at 90°, one leg in front, one to the side.","Sit tall, hands behind you if needed.","Lift both knees and rotate them to the other side.","Keep switching slowly side to side."],c:["Tall spine","Slow and controlled","Feet stay put"],m:"Slumping and rushing the switch.",z:"Breathe slowly; stay in a pain-free range."},
"kb-sa-row":{q:"single arm kettlebell row",s:["Put one hand and knee on the bench, other foot on the floor, bell hanging below the shoulder.","Flat back, neck long.","Row the bell towards your hip, breathing out.","Lower slowly; finish reps, then switch."],c:["Elbow towards hip","Flat back","No twisting"],m:"Twisting the torso to yank the bell up.",z:BR},
// moves
"Cat-cow":{q:"cat cow stretch",s:["Get on hands and knees, hands under shoulders, knees under hips.","Breathe in and gently arch, chest forward, looking slightly ahead.","Breathe out and round your back up, one segment at a time.","Move slowly between the two."],c:["Move segment by segment","Slow breathing","Keep the head in line"],m:"Rushing or cranking the neck.",z:"Keep your head level with your spine – no dropping it down."},
"World's greatest stretch":{q:"worlds greatest stretch",s:["Step into a long lunge, hands on the floor inside the front foot (or on the block).","Drop the front elbow towards the instep.","Rotate and reach the same arm up to the ceiling, following with your eyes.","Return and repeat, then switch sides."],c:["Back leg long","Open the chest","Slow breathing"],m:"Collapsing the hips to the floor.",z:"Hands on the block if needed so your head stays above your hips."},
"Thoracic open book":{q:"thoracic open book stretch",s:["Lie on your side, knees bent to 90° and stacked, arms straight out in front.","Keep the knees together on the floor.","Open the top arm across to the other side, rotating your upper back.","Pause, breathe out, and return."],c:["Knees stay together","Rotate from the upper back","Eyes follow the hand"],m:"Letting the knees lift apart.",z:"Breathe out into the rotation."},
"Broomstick pass-throughs":{q:"broomstick shoulder pass through",s:["Hold a broomstick with a wide grip in front of your hips.","Keeping arms straight, lift it over your head.","Continue behind you as far as is comfortable.","Return the same way."],c:["Wide grip","Straight arms","Ribs down"],m:"Gripping too narrow and forcing it.",z:"Stay pain-free; widen the grip if it pinches."},
"Lunge with overhead reach":{q:"lunge with overhead reach",s:["Step one foot back into a lunge, back knee down or hovering.","Squeeze the back glute.","Reach the same-side arm overhead and lean slightly away.","Hold briefly, step back up and switch."],c:["Squeeze back glute","Ribs down","Tall chest"],m:"Arching the lower back instead of stretching the hip.",z:"Breathe out as you reach."},
"Wall slides":{q:"wall slides exercise",s:["Stand with your back against a wall, arms in a W shape against it.","Keep your lower back and arms touching the wall.","Slide the arms up into a Y.","Slide back down to W."],c:["Ribs down","Forearms on the wall","Slow"],m:"Arching the back off the wall.",z:"Breathe steadily."},
"Leg swings":{q:"leg swings dynamic stretch",s:["Hold the rack for balance.","Swing one leg front to back (or across the body side to side).","Start small and gradually get bigger.","Switch legs."],c:["Tall posture","Relaxed swing","Build range gradually"],m:"Swinging wildly from the start.",z:"Keep it smooth and controlled."},
"Bodyweight squat":{q:"bodyweight squat",s:["Stand feet shoulder-width, toes slightly out.","Sit down slowly between your heels.","Pause at a comfortable depth.","Stand, breathing out."],c:["Heels down","Knees over toes","Chest up"],m:"Knees caving in.",z:BR},
"Ankle rocks":{q:"knee to wall ankle mobility",s:["Half-kneel facing a wall or the rack, front foot a hand's width away.","Keep the heel down.","Rock the knee forward over the toes.","Rock back and repeat."],c:["Heel stays down","Knee over middle toe","Smooth rhythm"],m:"Heel lifting off the floor.",z:"Pain-free range only."},
"Hip CARs":{q:"standing hip CARs controlled articular rotations",s:["Stand tall holding the rack, weight on one leg.","Lift the other knee up in front.","Slowly open it out to the side, then rotate it behind you, drawing the biggest circle you can.","Reverse direction; switch legs."],c:["Only the hip moves","Slow with tension","Biggest circle you control"],m:"Twisting the pelvis to fake the range.",z:"Breathe slowly; move only in a pain-free range."},
"Couch stretch":{q:"couch stretch",s:["Kneel with one knee against the bench or wall, shin up it (pad under knee).","Step the other foot forward into a lunge.","Squeeze the back glute and lift your chest tall.","Hold and breathe."],c:["Squeeze the glute","Ribs down","Hands on front knee"],m:"Arching the lower back.",z:"Ease in; don't force. Breathe out into it."},
"Half-kneeling hip flexor with reach":{q:"half kneeling hip flexor stretch with reach",s:["Kneel on one knee, other foot forward.","Tuck the pelvis and squeeze the back glute.","Shift gently forward.","Reach the arm on the kneeling side up and slightly over."],c:["Tuck the pelvis","Small forward shift","Long reach"],m:"Leaning too far and arching the back.",z:"Breathe out into the stretch."},
"90/90 hold":{q:"90 90 hip stretch lift offs",s:["Sit in the 90/90 position, both knees bent at 90°.","Sit tall over the front shin.","Hold, then try to lift the back knee/foot a little off the floor (lift-off).","Lower and repeat; switch sides."],c:["Tall spine","Small controlled lift","Hips stay put"],m:"Leaning back to cheat the lift.",z:"Keep breathing."},
"Doorway/rack chest stretch":{q:"doorway chest stretch",s:["Place your forearm on the rack upright at shoulder height.","Step through gently until you feel the chest stretch.","Hold and breathe.","Switch sides."],c:["Elbow at shoulder height","Gentle","Shoulder down"],m:"Pushing into shoulder pain.",z:"Breathe out into it."},
"Seated lat reach at bench":{q:"seated lat stretch",s:["Kneel or sit facing the bench, elbows on it.","Sit hips back while keeping the head level.","Feel the stretch along the sides of your back.","Lean slightly to each side."],c:["Head in line","Hips back","Long exhale"],m:"Dropping the head below the hips.",z:"Keep the head level – no head-down position."},
"Shoulder CARs":{q:"shoulder CARs controlled articular rotations",s:["Stand tall, make a fist with one hand, brace lightly.","Raise the straight arm forward and up overhead.","Rotate it behind you and down, drawing the biggest slow circle you can.","Reverse direction; switch arms."],c:["Only the shoulder moves","Slow with tension","Ribs down"],m:"Twisting the torso to get round.",z:"Breathe slowly; pain-free range."},
"Ankle CARs":{q:"ankle CARs",s:["Sit or stand holding the rack, lift one foot.","Point and flex the foot, then draw slow circles.","Go both directions.","Switch feet."],c:["Only the ankle moves","Big slow circles","Keep the shin still"],m:"Moving the whole leg.",z:"Pain-free range."},
"Supported deep squat hold":{q:"supported deep squat hold",s:["Hold the rack upright with both hands.","Sit down into a deep squat, heels down if you can.","Hold, chest up, breathing slowly.","Stand using the rack."],c:["Heels down","Chest tall","Relax into it"],m:"Rounding forward with the head dropping.",z:"Keep the head up; breathe."},
"Wrist CARs":{q:"wrist CARs",s:["Hold your forearm still with the other hand.","Make a fist.","Draw slow, big circles with the wrist.","Reverse; switch sides."],c:["Forearm still","Slow","Full range"],m:"Rushing it.",z:"Gentle."},
"Slow breathing lying on back":{q:"diaphragmatic breathing lying down",s:["Lie on your back, knees bent, one hand on your belly.","Breathe in through the nose for about 4 s.","Breathe out slowly for about 6 s.","Repeat, relaxing more each breath."],c:["Belly rises first","Long exhale","Relax the jaw"],m:"Forcing big chest breaths.",z:"Stop if you feel dizzy."},
"Calf stretch on block":{q:"calf stretch on step",s:["Stand with the ball of one foot on the block, holding the rack.","Let the heel lower slowly below the block.","Hold with a straight knee, then bend the knee slightly for the lower calf.","Switch sides."],c:["Hold the rack","Slow","Breathe"],m:"Bouncing.",z:"Gentle stretch only."},
"Bird-dog":{q:"bird dog exercise",s:["Hands and knees, hands under shoulders, back flat.","Slowly reach one arm forward and the opposite leg back (3 s).","Hold 1 s, keeping hips level.","Return slowly and switch."],c:["Hips level","Reach long, not high","Head in line with spine"],m:"Twisting the hips or arching the back.",z:"Breathe out as you reach; head level, not dropped."}};
var HAL={"Segmental cat-cow":"Cat-cow","Standing hip CARs":"Hip CARs","Standing hip circles":"Hip CARs","Walking lunge with overhead reach":"Lunge with overhead reach","90/90 hold with lift-offs":"90/90 hold","90/90 end-range hold":"90/90 hold","90/90 hip switches":"hip-9090","Side plank":"side-plank","Dead bug":"dead-bug"};
function hkey(n){var k=n.replace(/\s*\(.*?\)/g,"").replace(/ – .*$/,"").replace(/,.*$/,"").replace(/ @.*$/,"").replace(/ \+ lift-offs$/,"").trim();return HAL[k]||k;}
